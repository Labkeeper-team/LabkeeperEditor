version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      # В некоторых браузерах (safari) на новых версиях 
      # библиотеки может некорректно отображаться pdf, 
      # обновлять с осторожностью
      - dependency-name: "pdfjs-dist"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "mathjax"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "mathjax-full"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      npm-dependencies:
        patterns:
          - "*"
