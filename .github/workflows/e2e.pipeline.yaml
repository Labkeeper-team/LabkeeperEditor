name: labkeeper-e2e-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-self-hosted
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  e2e:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'E2E') && (github.event.action != 'labeled' || github.event.label.name == 'E2E') }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: e2e-pr-${{ github.run_id }}
      COMPOSE_FILE: scripts/ci/e2e/docker-compose.yml
      COMPOSE_CONVERT_WINDOWS_PATHS: '1'
      E2E_IMAGE: cr.yandex/crpjhav5dledksn6gaeo/labkeeper-e2e:44
      E2E_CAPTCHA_BYPASS_TOKEN: ${{ secrets.E2E_CAPTCHA_BYPASS_TOKEN }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v6

      - name: Prepare
        run: |
          echo %ProgramFiles%\Git\cmd>> "%GITHUB_PATH%"
          echo %ProgramFiles%\Docker\Docker\resources\bin>> "%GITHUB_PATH%"
          echo %ProgramFiles%\Docker\Docker\resources\cli-plugins>> "%GITHUB_PATH%"
          if not exist test-results mkdir test-results
          if not exist playwright-report mkdir playwright-report
          if not exist .docker-ci mkdir .docker-ci
          echo DOCKER_CONFIG=%GITHUB_WORKSPACE%\.docker-ci>> "%GITHUB_ENV%"
          echo E2E_WORKSPACE=%GITHUB_WORKSPACE:\=/%>> "%GITHUB_ENV%"

      - name: Login to Yandex Container Registry
        env:
          YC_DOCKER_REGISTRY_TOKEN: ${{ secrets.YC_DOCKER_REGISTRY_TOKEN }}
        run: echo %YC_DOCKER_REGISTRY_TOKEN%| docker login cr.yandex --username oauth --password-stdin

      - name: Start frontend and nginx
        run: docker-compose up --detach frontend nginx --wait --wait-timeout 360

      - name: Run Playwright tests
        run: docker-compose run --rm --no-deps --no-TTY --cpus 1 playwright

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment E2E summary on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- labkeeper-e2e-report -->';
            const reportPath = path.join('test-results', 'results.json');
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body;
            if (!fs.existsSync(reportPath)) {
              body = [
                marker,
                '## E2E-тесты',
                '',
                'Отчёт Playwright не найден — тесты не запустились или упали до записи результатов.',
                '',
                `[Лог запуска](${runUrl})`,
              ].join('\n');
            } else {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const stats = report.stats || {};
              const passed = stats.expected ?? 0;
              const failed = stats.unexpected ?? 0;
              const skipped = stats.skipped ?? 0;
              const flaky = stats.flaky ?? 0;
              const total = passed + failed + skipped + flaky;
              const status = failed > 0 ? 'не прошли' : 'прошли';
              body = [
                marker,
                '## E2E-тесты',
                '',
                `Результат: **${status}**`,
                '',
                `| | |`,
                `| --- | ---: |`,
                `| Всего | ${total} |`,
                `| Прошло | ${passed} |`,
                `| Не прошло | ${failed} |`,
                `| Пропущено | ${skipped} |`,
                `| Flaky | ${flaky} |`,
                '',
                `[Лог запуска](${runUrl})`,
              ].join('\n');
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Cleanup
        if: always()
        continue-on-error: true
        run: |
          docker-compose down --volumes --remove-orphans --rmi local
          if exist test-results rmdir /s /q test-results
          if exist playwright-report rmdir /s /q playwright-report
          if exist .docker-ci rmdir /s /q .docker-ci
          docker logout cr.yandex
