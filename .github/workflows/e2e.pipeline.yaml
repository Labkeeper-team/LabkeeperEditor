name: labkeeper-e2e-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-self-hosted
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  e2e:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'E2E') && (github.event.action != 'labeled' || github.event.label.name == 'E2E') }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: e2e-pr-${{ github.run_id }}
      COMPOSE_FILE: scripts/ci/e2e/docker-compose.yml
      COMPOSE_CONVERT_WINDOWS_PATHS: '1'
      E2E_IMAGE: cr.yandex/crpjhav5dledksn6gaeo/labkeeper-e2e:44
      E2E_CAPTCHA_BYPASS_TOKEN: ${{ secrets.E2E_CAPTCHA_BYPASS_TOKEN }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v6

      - name: Prepare
        run: |
          echo %ProgramFiles%\Git\cmd>> "%GITHUB_PATH%"
          echo %ProgramFiles%\Docker\Docker\resources\bin>> "%GITHUB_PATH%"
          echo %ProgramFiles%\Docker\Docker\resources\cli-plugins>> "%GITHUB_PATH%"
          if not exist test-results mkdir test-results
          if not exist playwright-report mkdir playwright-report
          if not exist .docker-ci mkdir .docker-ci
          echo DOCKER_CONFIG=%GITHUB_WORKSPACE%\.docker-ci>> "%GITHUB_ENV%"
          echo E2E_WORKSPACE=%GITHUB_WORKSPACE:\=/%>> "%GITHUB_ENV%"

      - name: Login to Yandex Container Registry
        env:
          YC_DOCKER_REGISTRY_TOKEN: ${{ secrets.YC_DOCKER_REGISTRY_TOKEN }}
        run: echo %YC_DOCKER_REGISTRY_TOKEN%| docker login cr.yandex --username oauth --password-stdin

      - name: Start frontend and nginx
        run: docker-compose up --detach frontend nginx --wait --wait-timeout 360

      - name: Run Playwright tests
        run: docker-compose run --rm --no-deps --no-TTY playwright

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        continue-on-error: true
        run: |
          docker-compose down --volumes --remove-orphans --rmi local
          if exist test-results rmdir /s /q test-results
          if exist playwright-report rmdir /s /q playwright-report
          if exist .docker-ci rmdir /s /q .docker-ci
          docker logout cr.yandex
