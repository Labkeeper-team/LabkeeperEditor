name: labkeeper-e2e-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-self-hosted
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  e2e:
    if: ${{ contains(github.event.pull_request.labels.*.name, 'E2E') && (github.event.action != 'labeled' || github.event.label.name == 'E2E') }}
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: e2e-pr-${{ github.run_id }}
      COMPOSE_FILE: scripts/ci/e2e/docker-compose.yml
      COMPOSE_CONVERT_WINDOWS_PATHS: '1'
      E2E_IMAGE: cr.yandex/crpjhav5dledksn6gaeo/labkeeper-e2e:latest
      E2E_CAPTCHA_BYPASS_TOKEN: ${{ secrets.E2E_CAPTCHA_BYPASS_TOKEN }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6

      - name: Prepare artifact directories
        run: |
          $dockerConfig = Join-Path $env:GITHUB_WORKSPACE '.docker-ci'
          New-Item -ItemType Directory -Force -Path test-results, playwright-report, $dockerConfig | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "DOCKER_CONFIG=$dockerConfig"
          Add-Content -Path $env:GITHUB_ENV -Value "E2E_WORKSPACE=$($env:GITHUB_WORKSPACE.Replace('\', '/'))"

      - name: Login to Yandex Container Registry
        env:
          YC_DOCKER_REGISTRY_TOKEN: ${{ secrets.YC_DOCKER_REGISTRY_TOKEN }}
        run: |
          $token = "$env:YC_DOCKER_REGISTRY_TOKEN".Trim().Trim('"').Trim("'")
          if (-not $token) { throw 'YC_DOCKER_REGISTRY_TOKEN is empty' }
          $user = 'oauth'
          if ($token.StartsWith('t1.')) { $user = 'iam' }
          $tokenFile = Join-Path $env:RUNNER_TEMP 'yc-cr-token.txt'
          [System.IO.File]::WriteAllText($tokenFile, $token, (New-Object System.Text.UTF8Encoding $false))
          try {
            cmd /c "docker login cr.yandex --username $user --password-stdin < `"$tokenFile`""
            if ($LASTEXITCODE -ne 0) { throw 'docker login to cr.yandex failed' }
          } finally {
            Remove-Item -Force $tokenFile -ErrorAction SilentlyContinue
          }

      - name: Start frontend and nginx
        run: docker compose up -d frontend nginx --wait --wait-timeout 360

      - name: Run Playwright tests
        run: docker compose run --rm --no-deps -T playwright

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        continue-on-error: true
        run: |
          docker compose down -v --remove-orphans --rmi local
          Remove-Item -Recurse -Force test-results, playwright-report, .docker-ci -ErrorAction SilentlyContinue
          docker logout cr.yandex
